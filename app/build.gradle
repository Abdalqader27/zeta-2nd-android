plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    buildFeatures {
        viewBinding = true
        compose = true
    }
    namespace 'com.Elkood.ling_en4'
    compileSdk 36
    defaultConfig {
        applicationId "com.Elkood.ling_en4"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 11
        versionName "1.4.7"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.fragment:fragment-compose:1.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    implementation 'com.github.ViksaaSkool:AwesomeSplash:v1.0.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0-beta01'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.github.ittianyu:BottomNavigationViewEx:2.0.4'
    implementation 'com.diegodobelo.expandingview:expanding-view:0.9.4'
    implementation 'com.ogaclejapan.smarttablayout:library:1.6.1@aar'
    implementation 'com.ogaclejapan.smarttablayout:utils-v4:1.6.1@aar'
    implementation 'com.github.f0ris.sweetalert:library:1.6.2'
    implementation 'com.alibaba.android:ultraviewpager:1.0.7.8'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.mxn.soul:flowingdrawer-core:2.1.0'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.nightonke:boommenu:2.1.1'
    implementation 'com.github.jd-alexander:android-flat-button:v1.1'
    implementation "com.github.parse-community.Parse-SDK-Android:parse:1.21.0"
    implementation 'devlight.io:navigationtabbar:1.2.5'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
//    implementation 'com.google.android.gms:play-services-ads:17.2.1'
//    implementation 'com.google.android.gms:play-services-ads:17.2.1'
    implementation 'com.google.firebase:firebase-messaging:22.0.0'
    implementation 'com.github.woxingxiao:BounceScrollView:1.3'
//    implementation 'androidx.constraintlayout:constraintlayout:2.0.0-beta4'
//    implementation 'androidx.constraintlayout:constraintlayout-solver:2.0.0-beta4'
    implementation 'com.etebarian:meow-bottom-navigation:1.0.4'
    implementation 'com.ramotion.cardslider:card-slider:0.3.1'
}
apply plugin: 'com.google.gms.google-services'
